    title: "Especificação de repassarBoleto()"
    summary: "Função principal: busca e-mail da Premier no mês corrente, extrai link do PDF, baixa o arquivo, envia para a imobiliária com assunto/corpo padronizados, aplica label de controle. Roda via trigger diário"
