  - id: "config-spec"
    type: specification
    title: "Parâmetros de configuração (config.js)"
    summary: "Todas as constantes do projeto: REMETENTE_PREMIER, DESTINO_IMOBILIARIA, LABEL_PREFIXO, CONTRATO_FIM, DRY_RUN, DIAS_VERIFICACAO, DIA_ALERTA, REPASSE_MES_INICIO, PASTA_MANUAL_ID, DIAS_VERIFICACAO_MANUAL, LOG_PLANILHA_NOME. Nenhuma string de negócio fora deste arquivo"
    tags: [config, constantes, parametros, contrato]
    token_count: 420
    path: ".ica/fragments/specifications/config-spec.md"
    dependencies: []
