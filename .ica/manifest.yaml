  - id: "alerta-spec"
    type: specification
    title: "Especificação de verificarPendencia()"
    summary: "Função de guarda: roda nos dias 8, 9 e 10 de cada mês. Se não existir label de repasse do mês corrente, envia e-mail de alerta ao dono da conta. Aborta silenciosamente após CONTRATO_FIM"
    tags: [alerta, pendencia, trigger, dias-8-10]
