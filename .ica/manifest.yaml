  - id: "repasse-spec"
    type: specification
    title: "Especificação de repassarBoleto() — fluxo por e-mail"
    summary: "Loop de REPASSE_MES_INICIO até mês atual; filtra meses sem label; para cada pendente chama _repassarMes(): busca e-mail Premier, baixa PDF, OCR, guard de idempotência por valorId, envia, cria label. Helpers _gerarListaMeses e _repassarMes extraídos para clareza"
    tags: [repasse, gmail, pdf, trigger, loop, ocr, valorId]
    token_count: 520
    path: ".ica/fragments/specifications/repasse-spec.md"
    dependencies: [config-spec, pdf-strategy, idempotency-decision, email-spec, ocr-spec, log-spec]
    priority: high
    last_modified: "2026-04-11"

  - id: "alerta-spec"
    type: specification
    title: "Especificação de verificarPendencia()"
    summary: "Roda nos dias 8, 9 e 10. Dias 8-9: log silencioso apenas. Dia 10 ao meio-dia: envia alerta se não existir label do mês corrente. Checa prefixo de mês sem valorId (qualquer repasse do mês basta)"
    tags: [alerta, pendencia, trigger, dia-10, meio-dia]
    token_count: 360
    path: ".ica/fragments/specifications/alerta-spec.md"
    dependencies: [config-spec, idempotency-decision]
    priority: high
    last_modified: "2026-04-11"

  - id: "email-spec"
    type: specification
    title: "Especificação do e-mail de repasse"
    summary: "Destinatário: DESTINO_IMOBILIARIA. Assunto: 'Ajuste de Condomínio'. Corpo com A/C Mariana, competência mês X e aluguel mês X+1. PDF como anexo. Válido para ambos os fluxos (e-mail e manual)"
    tags: [email, assunto, corpo, competencia, imobiliaria]
    token_count: 290
    path: ".ica/fragments/specifications/email-spec.md"
    dependencies: [config-spec]
    priority: high
    last_modified: "2026-04-10"

  - id: "ocr-spec"
    type: specification
    title: "Especificação do módulo OCR — src/ocr.js"
    summary: "Usa Drive API v2 (Drive_OCR) para converter PDF → Google Doc temporário, extrai texto e apaga o Doc no finally. Regex para Premier, vencimento e valor. valorId = valor sem separadores. Em falha: envia alerta por e-mail, não remove arquivo, lança erro"
    tags: [ocr, pdf, drive-api, premier, parsing, valorId]
    token_count: 380
    path: ".ica/fragments/specifications/ocr-spec.md"
    dependencies: [config-spec]
    priority: high
    last_modified: "2026-04-11"

  - id: "manual-spec"
    type: specification
    title: "Especificação do fluxo manual — src/manual.js"
    summary: "Processa PDFs depositados na pasta Drive (WhatsApp). Age dias 10-13. OCR em cada arquivo, agrupa por (mesRef+valorId), ordena por vencimento, envia um por grupo, move todos para lixeira. Label flutuante sem thread. Enc ou Reenc conforme label existente"
    tags: [manual, drive, pasta, whatsapp, duplicata, reenvio, flutuante]
    token_count: 440
    path: ".ica/fragments/specifications/manual-spec.md"
    dependencies: [config-spec, ocr-spec, idempotency-decision, email-spec, log-spec]
    priority: high
    last_modified: "2026-04-11"

  - id: "log-spec"
    type: specification
    title: "Especificação do módulo de log — src/log.js"
    summary: "registrarLog() grava em Google Sheets criada automaticamente em PASTA_MANUAL_ID. ID da planilha persiste em PropertiesService. Colunas: Timestamp, Função, MesRef, ValorId, Arquivo, Ação, Origem, Detalhes. Erros nunca propagam para o chamador"
    tags: [log, planilha, sheets, auditoria, properties-service]
    token_count: 300
    path: ".ica/fragments/specifications/log-spec.md"
