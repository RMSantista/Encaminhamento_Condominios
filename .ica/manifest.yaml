schema_version: "1.0.0"

project:
  name: "Encaminhamento_Condominios"
  description: "Google Apps Script que monitora Gmail e Drive, detecta boleto mensal da Premier, extrai dados via OCR e repassa para a Pirâmid Imóveis com controle de idempotência, log em Sheets e alerta de não-recebimento"
  tech_stack: [google-apps-script, clasp, javascript, gmail-api, drive-api-v2, google-sheets, github]
  language: pt-BR

last_indexed: "2026-04-11T00:00:00Z"

fragments:

  # ── DECISIONS ──────────────────────────────────────────────────────────────

  - id: "tooling-clasp"
    type: decision
    title: "Uso de clasp para versionamento do GAS"
    summary: "Por que Google Apps Script + clasp é a stack correta: roda grátis na conta Google, tem acesso nativo a Gmail/Drive, e clasp permite desenvolvimento local versionado no GitHub sem precisar de servidor"
    tags: [gas, clasp, arquitetura, github, setup]
    token_count: 320
    path: ".ica/fragments/decisions/tooling-clasp.md"
    dependencies: []
    priority: high
    last_modified: "2026-04-10"

  - id: "pdf-strategy"
    type: decision
    title: "Estratégia de download e extração do PDF do boleto"
    summary: "Fluxo por e-mail: extrair href do botão via regex, baixar com UrlFetchApp. Fluxo manual: ler da pasta Drive. Em ambos os casos, extrair dados via OCR (Drive API v2). Regex primária busca anchor text 'Ver boleto'; fallback busca .pdf no href"
    tags: [pdf, premier, gmail, urlfetch, blob, ocr, drive]
    token_count: 320
    path: ".ica/fragments/decisions/pdf-strategy.md"
    dependencies: []
    priority: high
    last_modified: "2026-04-11"

  - id: "idempotency-decision"
    type: decision
    title: "Controle de idempotência via Gmail labels com valorId"
    summary: "Labels com formato Condomínio_{mesRef}-{valorId}_{Enc|Reenc}_em_{data}_{E|P} garantem idempotência cruzada entre fluxo e-mail e fluxo manual. valorId é o valor do boleto sem separadores usado como ID único. Helpers construirLabel/Prefixo/labelExiste em escopo global"
    tags: [idempotencia, gmail-labels, estado, segurança, valorId, enc-reenc]
    token_count: 380
    path: ".ica/fragments/decisions/idempotency-decision.md"
    dependencies: []
    priority: high
    last_modified: "2026-04-11"

