    type: specification
    title: "Parâmetros de configuração (config.js)"
    summary: "Todas as constantes do projeto: REMETENTE_PREMIER, ASSUNTO_PREMIER, DESTINO_IMOBILIARIA, LABEL_BASE, CONTRATO_FIM, TIMEZONE. Nenhuma string de negócio pode aparecer fora deste arquivo"
