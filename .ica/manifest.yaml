  - id: "pdf-strategy"
    type: decision
    title: "Estratégia de download do PDF do boleto"
    summary: "O botão no e-mail da Premier gera um link direto para PDF (não portal autenticado). Estratégia: extrair href do botão via regex no HTML do e-mail, baixar com UrlFetchApp, anexar ao e-mail de repasse como Blob"
    tags: [pdf, premier, gmail, urlfetch, blob]
    token_count: 280
    path: ".ica/fragments/decisions/pdf-strategy.md"
    dependencies: []
    priority: high
    last_modified: "2026-04-10"

  - id: "idempotency-decision"
    type: decision
    title: "Controle de idempotência via Gmail labels"
    summary: "Para garantir que o repasse nunca seja feito duas vezes no mesmo mês, usamos labels do Gmail como estado persistente: 'Condominio/Repassado-YYYY-MM'. Verificar label antes de agir; criar label após envio bem-sucedido"
    tags: [idempotencia, gmail-labels, estado, segurança]
    token_count: 240
    path: ".ica/fragments/decisions/idempotency-decision.md"
    dependencies: []
    priority: high
    last_modified: "2026-04-10"

